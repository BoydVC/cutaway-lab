<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cutaway Lab worksheet</title>
<style>body{font:15px/1.5 Georgia,serif;max-width:760px;margin:20px auto;color:#111}h1{font-size:24px}h2{font-size:17px;margin-top:18px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:4px 8px;text-align:left}.order{list-style:none;padding:0}.key{margin-top:20px;color:#555}.bar{margin-bottom:10px}@media print{.bar{display:none}.key{display:none}}</style></head>
<body><div class="bar"><select id="pick"></select> <button onclick="print()">🖨 Print</button></div><div id="out"></div>
<script type="module">
import { machines } from './machines/index.js'; import { worksheet } from './src/worksheet.js';
const sel = document.getElementById('pick'); sel.innerHTML = machines.map((m) => `<option value="${m.id}">${m.emoji} ${m.title}</option>`).join('');
const go = () => { const m = machines.find((x) => x.id === sel.value); document.getElementById('out').innerHTML = worksheet(m, 7).html; history.replaceState(null, '', '#' + m.id); };
sel.value = location.hash.slice(1) || machines[0].id; if (!sel.value) sel.value = machines[0].id; sel.onchange = go; go();
</script></body></html>
